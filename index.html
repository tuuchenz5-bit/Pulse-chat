<!DOCTYPE html>
<html>
<head>
    <title>PulseChat & Memories</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 20px auto; padding: 10px; background: #f4f6f9; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #chat-box { height: 250px; overflow-y: scroll; border: 1px solid #ddd; padding: 10px; background: #fafafa; margin-bottom: 10px; }
        .msg { margin: 5px 0; padding: 8px; border-radius: 6px; background: #e1f5fe; }
        .memory-grid { display: flex; gap: 10px; flex-wrap: wrap; }
        .memory-item { width: 150px; border: 1px solid #ddd; padding: 5px; border-radius: 8px; background: #fff; }
        .memory-item img { width: 100%; height: 120px; object-fit: cover; border-radius: 5px; }
        input, button { padding: 8px; margin: 4px 0; }
        button { background: #0084ff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>PulseChat + Shared Memories</h2>

    <!-- Step 1: Register -->
    <div class="card">
        <h3>1. Account (Email & @Username)</h3>
        <input id="email" placeholder="Email (e.g. sam@mail.com)">
        <input id="username" placeholder="Username (e.g. @sam)">
        <input id="password" type="password" placeholder="Password">
        <button onclick="register()">Register / Set Active User</button>
        <p id="user-status"></p>
    </div>

    <!-- Step 2: Join or Create Group -->
    <div class="card">
        <h3>2. Create or Join a Group</h3>
        <input id="group-name" placeholder="Group Name (e.g. WeekendTrip)">
        <button onclick="createAndJoinGroup()">Enter Group</button>
    </div>

    <!-- Step 3: Live Chat -->
    <div class="card">
        <h3>3. Real-Time Group Chat (<span id="active-group">None</span>)</h3>
        <div id="chat-box"></div>
        <input id="msg-input" placeholder="Type a message..." style="width: 70%;">
        <button onclick="sendMessage()">Send</button>
    </div>

    <!-- Step 4: Shared Memories -->
    <div class="card">
        <h3>4. Shared Memories Vault</h3>
        <input type="file" id="memory-file" accept="image/*">
        <input id="memory-caption" placeholder="Memory caption...">
        <button onclick="uploadMemory()">Save to Memories</button>
        <div class="memory-grid" id="memories-list" style="margin-top: 15px;"></div>
    </div>

<script>
    let currentUser = "";
    let currentGroup = "";
    let ws = null;

    async function register() {
        const form = new FormData();
        form.append("email", document.getElementById("email").value);
        form.append("username", document.getElementById("username").value);
        form.append("password", document.getElementById("password").value);

        const res = await fetch("/register", { method: "POST", body: form });
        const data = await res.json();
        currentUser = data.username || document.getElementById("username").value;
        if (!currentUser.startsWith("@")) currentUser = "@" + currentUser;
        document.getElementById("user-status").innerText = "Logged in as: " + currentUser;
    }

    async function createAndJoinGroup() {
        if (!currentUser) return alert("Please set your @username first!");
        currentGroup = document.getElementById("group-name").value;
        document.getElementById("active-group").innerText = currentGroup;

        const form = new FormData();
        form.append("name", currentGroup);
        form.append("created_by", currentUser);
        await fetch("/groups", { method: "POST", body: form });

        loadHistory();
        loadMemories();

        if (ws) ws.close();
        const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${wsProtocol}//${location.host}/ws/${currentGroup}/${currentUser}`);
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "chat") {
                appendMessage(data.sender, data.content, data.time);
            } else if (data.type === "new_memory") {
                loadMemories();
            }
        };
    }

    async function loadHistory() {
        const res = await fetch(`/messages/${currentGroup}`);
        const msgs = await res.json();
        const box = document.getElementById("chat-box");
        box.innerHTML = "";
        msgs.forEach(m => appendMessage(m.sender_username, m.content, ""));
    }

    function appendMessage(sender, text, time) {
        const box = document.getElementById("chat-box");
        box.innerHTML += `<div class="msg"><b>${sender}</b>: ${text} <small>${time}</small></div>`;
        box.scrollTop = box.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById("msg-input");
        if (ws && input.value) {
            ws.send(input.value);
            input.value = "";
        }
    }

    async function uploadMemory() {
        if (!currentGroup || !currentUser) return alert("Join a group first!");
        const fileInput = document.getElementById("memory-file");
        if (!fileInput.files.length) return alert("Select a photo!");

        const form = new FormData();
        form.append("uploaded_by", currentUser);
        form.append("caption", document.getElementById("memory-caption").value);
        form.append("file", fileInput.files[0]);

        await fetch(`/memories/${currentGroup}`, { method: "POST", body: form });
        document.getElementById("memory-caption").value = "";
        loadMemories();
    }

    async function loadMemories() {
        const res = await fetch(`/memories/${currentGroup}`);
        const items = await res.json();
        const grid = document.getElementById("memories-list");
        grid.innerHTML = "";
        items.forEach(m => {
            grid.innerHTML += `
                <div class="memory-item">
                    <img src="${m.file_url}">
                    <p><b>${m.uploaded_by}</b>: ${m.caption}</p>
                </div>`;
        });
    }
</script>
</body>
</html>
